<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="幫助日語學校學生降低打工面試前壓力的快速檢查工具。">
    <title>Interview Preflight Checklist</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar" aria-label="進度">
        <div>
          <p class="eyebrow">Interview Preflight Checklist</p>
          <p class="progress-text" id="progressText">1 / 5</p>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span class="progress-fill" id="progressFill"></span>
        </div>
      </header>

      <main id="app" class="screen" tabindex="-1" aria-live="polite"></main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
